[package]
name = "crabkv"
version = "0.1.0"
edition = "2021"
description = "A next-generation distributed data platform written in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
mimalloc = "0.1"
itoa = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
parking_lot = "0.12"
ahash = "0.8"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
hashbrown = "0.15"
smallvec = "1"
memchr = "2"
crossbeam = "0.8"
crossbeam-queue = "0.3"
crossbeam-skiplist = "0.1"
crossbeam-utils = "0.8"
slab = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[[bench]]
name = "kv_bench"
harness = false

[[bench]]
name = "protocol_bench"
harness = false
